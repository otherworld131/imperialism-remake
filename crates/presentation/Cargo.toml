[package]
name = "presentation"
version.workspace = true
edition.workspace = true

[dependencies]
application = { path = "../application" }

# Bevy game engine. Keep the POC on the native 2D/UI/X11 feature set so Linux
# builds do not require Wayland development packages.
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "bevy_winit",
    "x11",
    "default_font",
    "multi_threaded",
    "2d_bevy_render",
    "ui_bevy_render",
    "png",
] }
