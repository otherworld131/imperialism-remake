[package]
name = "presentation"
version.workspace = true
edition.workspace = true

[dependencies]
frontend-api = { path = "../frontend-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy game engine. Native 2D/UI feature set. The "wayland" backend is
# intentionally absent: building it requires pkg-config + libwayland-dev,
# which this dev machine (WSL2) lacks; X11 covers WSLg via XWayland.
# Re-add "wayland" once the system packages are installed.
bevy = { version = "=0.18.1", default-features = false, features = [
    "default_app",
    "bevy_winit",
    "x11",
    "default_font",
    "multi_threaded",
    "2d_bevy_render",
    "ui_bevy_render",
    "png",
    # Widget kit: headless interaction cores + pointer events on UI nodes.
    # `bevy_input_focus` (keyboard focus) already rides in via `default_app`.
    "experimental_bevy_ui_widgets",
    "ui_picking",
] }
