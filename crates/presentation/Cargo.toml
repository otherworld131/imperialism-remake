[package]
name = "presentation"
version.workspace = true
edition.workspace = true

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }

# Bevy game engine. Uses default features which auto-detect the platform:
# - Windows: DirectX 12 / Vulkan
# - macOS: Metal
# - Linux: X11 + Wayland (requires libwayland-dev, libxkbcommon-dev)
#
# To build on Linux without wayland-dev, install:
#   sudo apt install libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
bevy = "0.18"
