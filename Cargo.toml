[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/domain-snapshot",
    "crates/application",
    "crates/flavor",
    "crates/infrastructure",
    "crates/presentation",
    "crates/wasm-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package]
name = "imperialism-remake"
version.workspace = true
edition.workspace = true

[[bin]]
name = "imperialism"
path = "src/main.rs"

[[bin]]
name = "imperialism-gui"
path = "src/gui.rs"
required-features = ["gui"]

[features]
gui = ["presentation"]

[dependencies]
application = { path = "crates/application" }
clap = { version = "4", features = ["derive"] }
domain = { path = "crates/domain" }
flavor = { path = "crates/flavor" }
infrastructure = { path = "crates/infrastructure" }
presentation = { path = "crates/presentation", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
