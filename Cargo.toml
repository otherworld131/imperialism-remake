[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/domain-snapshot",
    "crates/application",
    "crates/flavor",
    "crates/frontend-api",
    "crates/infrastructure",
    "crates/presentation",
    "crates/wasm-bridge",
    "tools/gen_assets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.test]
opt-level = 1

# Bevy is unusably slow with unoptimized dependencies; keep the inner-loop
# debug build snappy by optimizing deps while leaving our crates debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package]
name = "imperialism-remake"
version.workspace = true
edition.workspace = true

[[bin]]
name = "imperialism"
path = "src/main.rs"

[[bin]]
name = "imperialism-gui"
path = "src/gui.rs"
required-features = ["gui"]

[features]
gui = ["presentation"]
# Opt-in native Wayland backend for the GUI (Linux). Off by default — see
# crates/presentation/Cargo.toml. Use: `--features gui,wayland`.
wayland = ["presentation?/wayland"]

[dependencies]
application = { path = "crates/application" }
frontend-api = { path = "crates/frontend-api" }
clap = { version = "4", features = ["derive"] }
domain = { path = "crates/domain" }
flavor = { path = "crates/flavor" }
infrastructure = { path = "crates/infrastructure" }
presentation = { path = "crates/presentation", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
