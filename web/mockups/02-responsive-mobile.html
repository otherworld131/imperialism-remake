<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comp 2: Responsive Mobile Layout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Georgia, serif; background: #1a1a2e; color: #e0d8c0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Top Bar — collapsed for mobile ── */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: #0f0f23; border-bottom: 2px solid #3a3520;
    flex-shrink: 0; flex-wrap: nowrap; gap: 6px;
  }
  .top-bar .title { font-weight: bold; font-size: 14px; color: #daa520; white-space: nowrap; }
  .top-bar .stats { display: flex; gap: 8px; font-size: 11px; color: #b0a880; }
  .top-bar .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn {
    padding: 4px 10px; background: #3a3520; color: #e0d8c0;
    border: 1px solid #5a5030; cursor: pointer; font-family: Georgia, serif;
    font-size: 12px; border-radius: 2px;
  }
  .btn-end {
    padding: 4px 14px; background: #8b4513; color: #fff;
    border: 1px solid #a0522d; cursor: pointer; font-weight: bold;
    font-family: Georgia, serif; font-size: 12px; border-radius: 2px;
  }

  /* ── Layout: stacked on mobile ── */
  .main-area {
    display: flex; flex-direction: column; flex: 1; overflow: hidden; min-height: 0;
  }

  .map-container {
    flex: 1; background: #0a0a1a; position: relative; min-height: 200px;
  }
  .map-canvas {
    width: 100%; height: 100%; display: block;
    background: linear-gradient(135deg, #6fa8d6 0%, #5a94be 30%, #7aba3a 30%, #5a9a4a 50%, #8db35a 70%, #6fa8d6 100%);
  }
  .map-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; color: rgba(255,255,255,0.4); pointer-events: none; text-align: center;
  }
  .zoom-toggle { position: absolute; bottom: 8px; right: 8px; }

  /* ── Bottom Panel (replaces sidebar) ── */
  .bottom-panel {
    height: 180px; flex-shrink: 0; background: #161625;
    border-top: 2px solid #3a3520; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .panel-tabs {
    display: flex; background: #0f0f23; border-bottom: 1px solid #3a3520;
    flex-shrink: 0;
  }
  .panel-tab {
    flex: 1; padding: 6px 4px; text-align: center; font-size: 11px;
    color: #9a9a9a; background: none; border: none; cursor: pointer;
    font-family: Georgia, serif; border-bottom: 2px solid transparent;
  }
  .panel-tab.active { color: #daa520; border-bottom-color: #daa520; }
  .panel-tab:hover { color: #e0d8c0; }
  .panel-content { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .panel-title { color: #daa520; font-size: 13px; margin-bottom: 4px; }
  .tile-info { font-size: 12px; }
  .tile-info p { margin: 1px 0; }
  .nation-list { font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
  .nation-item { display: flex; justify-content: space-between; }

  /* ── Annotations ── */
  .annotation { position: fixed; z-index: 999; font-family: 'Helvetica Neue', sans-serif; pointer-events: none; }
  .callout { background: #ff4444; color: white; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .callout-green { background: #22c55e; }
  .callout-blue { background: #3b82f6; }
</style>
</head>
<body>
  <div class="annotation" style="top:4px;left:50%;transform:translateX(-50%)">
    <div class="callout callout-green">#2 Compact top bar for mobile</div>
  </div>
  <div class="annotation" style="bottom:190px;left:50%;transform:translateX(-50%)">
    <div class="callout callout-green">#2 Sidebar becomes bottom panel with tabs</div>
  </div>

  <main>
    <div class="top-bar">
      <span class="title">Deneb</span>
      <div class="stats">
        <span>T1 1815</span>
        <span>$0</span>
        <span>8 prov</span>
      </div>
      <div class="actions">
        <button class="btn">Tech</button>
        <button class="btn-end">End Turn</button>
      </div>
    </div>

    <div class="main-area">
      <div class="map-container">
        <div class="map-canvas"></div>
        <div class="map-label">[Hex map — full width, ~65% height]</div>
        <button class="btn zoom-toggle">Terrain</button>
      </div>

      <div class="bottom-panel">
        <div class="panel-tabs">
          <button class="panel-tab active">Tile</button>
          <button class="panel-tab">Nations</button>
          <button class="panel-tab">Army</button>
          <button class="panel-tab">Trade</button>
        </div>
        <div class="panel-content">
          <div class="tile-info">
            <p><b>Farm</b> — Province: Sindel</p>
            <p>Owner: Deneb &bull; Level: 2 &bull; Railroad</p>
          </div>
          <div style="margin-top:8px">
            <div class="panel-title">Nations</div>
            <div class="nation-list">
              <div class="nation-item"><span>Deneb</span><span>8</span></div>
              <div class="nation-item"><span>Devron</span><span>8</span></div>
              <div class="nation-item"><span>Haxaco</span><span>8</span></div>
              <div class="nation-item"><span>Kem</span><span>8</span></div>
              <div class="nation-item"><span>Ordune</span><span>8</span></div>
              <div class="nation-item"><span>Patagon</span><span>8</span></div>
              <div class="nation-item"><span>Zimm</span><span>8</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
